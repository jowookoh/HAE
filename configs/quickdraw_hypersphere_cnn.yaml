name: quickdraw_hypersphere_cnn

dataset:
  name: quickdraw
  img_size: 256
  channels: 1
  train_dir: quickdraw_dataset/train
  val_dir: quickdraw_dataset/val

model:
  encoder: quickdraw
  decoder: quickdraw_cnn
  bottleneck: hypersphere
  latent_dim: 512

training:
  epochs: 25
  batch_size: 64
  lr: 0.0001
  kl_weight: 0.001
  visualize_every: 5
