name: cifar_vae_transformer

dataset:
  name: cifar10
  img_size: 32
  channels: 3

model:
  encoder: cifar
  decoder: cifar_transformer
  bottleneck: vae
  latent_dim: 256
  decoder_kwargs:
    embed_dim: 256
    depth: 4
    num_heads: 8
    patch_size: 4

training:
  epochs: 50
  batch_size: 64
  lr: 0.0001
  kl_weight: 0.001
  visualize_every: 5
